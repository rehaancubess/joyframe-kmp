name: Release to Maven Central
# Uploads a signed release for validation only. Nothing is public until the owner presses Publish on
# the deployment at central.sonatype.com. Versions on Central can never be changed or deleted.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to release (for example v0.1.0-alpha04)
        required: true
permissions:
  contents: read
jobs:
  upload:
    # iOS artifacts need Xcode.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - run: node tools/audit-public-source.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0' > /dev/null
      - run: ./gradlew :joyframe:desktopTest --stacktrace
      # GitHub stores secret names in upper case; Gradle needs these exact property names.
      - run: ./gradlew :joyframe:publishToMavenCentral -Pjoyframe.release=true --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
