name: Deploy Lake Lab to GitHub Pages
# Manual until Pages is enabled (Settings → Pages → Source: GitHub Actions).
# Then add `push: branches: [main]` here to deploy on every push.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/audit-public-source.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Hosted runners ship the Android SDK; install only what this build needs.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0' > /dev/null
      # Procedural boat only: no -Pjoyframe.demoBoat, so no local model can reach the site.
      - run: ./gradlew :sample:wasmJsBrowserDistribution --stacktrace
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sample/build/dist/wasmJs/productionExecutable
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
