name: Verify toolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: node tools/audit-public-source.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Hosted runners ship the Android SDK; install only what this build needs.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0' > /dev/null
      - run: ./gradlew :joyframe:desktopTest :sample:desktopTest :sample-android:assembleDebug :sample:compileKotlinWasmJs :sample:compileKotlinIosSimulatorArm64 :sample:compileKotlinIosArm64 --stacktrace
      - run: ./gradlew :joyframe:publishAllPublicationsToStagingRepository
      - run: ./gradlew -p consumer-check test
      - run: ./gradlew :sample:compileKotlinDesktop -Pjoyframe.usePublished=true
